services:
  postgres:
    image: postgres:16
    container_name: banking-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bank_app
      POSTGRES_PASSWORD: bank_dev_password
      POSTGRES_DB: banking_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank_app -d banking_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: