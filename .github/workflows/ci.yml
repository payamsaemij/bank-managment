name: Banking System CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-checks:
    name: Lint, Tests and Coverage
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql+psycopg://bank_app:bank_dev_password@127.0.0.1:5432/banking_test_db
      TEST_DATABASE_URL: postgresql+psycopg://bank_app:bank_dev_password@127.0.0.1:5432/banking_test_db

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Flake8
        run: flake8 app tests

      - name: Run Unit Tests and Coverage
        run: |
          python -m pytest tests/ \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=html \
            --cov-report=xml

      - name: Upload HTML Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14